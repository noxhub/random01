/* ---- Mural geometry, in target units (mural width = 1, origin at its centre, +z toward viewer) ---- */
const H = 400/973;                 // target height
const TOP = H/2, BOT = -H/2;
const STEP = TOP - H*0.2775;       // roofline of the lower, wider part
const UP_L = -0.343, UP_R = 0.209; // left/right edges of the taller upper block
const DEPTH = 0.32;                // how far the building extends back

const $ = id => document.getElementById(id);
const stage = $('stage'), msg = $('msg');

/* ---------- character ---------- */
function makeAlien(){
  const skin = new THREE.MeshStandardMaterial({color:0x86f56a, roughness:.5});
  const belly = new THREE.MeshStandardMaterial({color:0xd6ffc4, roughness:.6});
  const dark = new THREE.MeshStandardMaterial({color:0x0d1a17, roughness:.15, metalness:.1});
  const white = new THREE.MeshBasicMaterial({color:0xffffff});
  const glow = new THREE.MeshStandardMaterial({color:0xff7ad9, emissive:0xff4fc8, emissiveIntensity:1.2});
  const S = (r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,28,20),m);
  const g = new THREE.Group();

  const body = S(.5,skin); body.scale.set(.78,.9,.72); body.position.y=.5; g.add(body);
  const tum = S(.4,belly); tum.scale.set(.7,.8,.4); tum.position.set(0,.47,.2); g.add(tum);
  const head = new THREE.Group(); head.position.y=1.3; g.add(head);
  const skull = S(.62,skin); skull.scale.set(1.12,.95,1); head.add(skull);
  const eyes=[];
  for(const sx of [-1,1]){
    const e = S(.21,dark); e.scale.set(.85,1.15,.5); e.position.set(sx*.27,.03,.5); e.rotation.z=-sx*.18; head.add(e); eyes.push(e);
    const gl = S(.05,white); gl.position.set(sx*.27+.06,.13,.6); head.add(gl);
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.4,8),skin);
    stalk.position.set(sx*.3,.72,0); stalk.rotation.z=-sx*.35; head.add(stalk);
    const tip = S(.085,glow); tip.position.set(sx*.37,.92,0); head.add(tip);
    const foot = S(.17,skin); foot.scale.set(1,.6,1.35); foot.position.set(sx*.22,.08,.08); g.add(foot);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.1,.022,8,20,Math.PI),dark);
  mouth.rotation.z=Math.PI; mouth.position.set(0,-.24,.57); head.add(mouth);
  const arms=[];
  for(const sx of [-1,1]){
    const p = new THREE.Group(); p.position.set(sx*.36,.72,0);
    const a = new THREE.Mesh(new THREE.CapsuleGeometry(.075,.3,6,12),skin); a.position.y=-.2; p.add(a);
    p.rotation.z = sx*.7; g.add(p); arms.push(p);
  }
  return {g, head, eyes, arms};
}

function makeSaucer(){
  const g = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({color:0xc9d3dc, roughness:.25, metalness:.85});
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1,36,18),metal); hull.scale.set(1,.2,1); g.add(hull);
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(.5,.62,.14,32),
    new THREE.MeshStandardMaterial({color:0x5fd1ff, roughness:.3, metalness:.3, emissive:0x1c6f9c, emissiveIntensity:.6}));
  deck.position.y=.17; g.add(deck);
  const lights=[];
  for(let i=0;i<8;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),
      new THREE.MeshStandardMaterial({color:0xfff2a8, emissive:0xffd84a, emissiveIntensity:1}));
    const a=i/8*Math.PI*2; m.position.set(Math.cos(a)*.82,-.03,Math.sin(a)*.82); g.add(m); lights.push(m);
  }
  const beam = new THREE.Mesh(new THREE.ConeGeometry(.55,1.3,24,1,true),
    new THREE.MeshBasicMaterial({color:0x9ff7ff, transparent:true, opacity:.16, side:THREE.DoubleSide, depthWrite:false}));
  beam.position.y=-.8; g.add(beam);
  return {g, lights, deckTop:.24};
}

/* ---------- scene content shared by AR and preview ---------- */
function buildWorld(root, {standIn}){
  root.add(new THREE.HemisphereLight(0xffffff,0x3a5560,1.5));
  const sun = new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(.4,1,.9); root.add(sun);

  // The building: invisible depth-only blocks in AR (so the alien is hidden behind the wall), solid stand-in for preview.
  const wallMat = standIn
    ? new THREE.MeshStandardMaterial({color:0x2f8f86, roughness:.9})
    : new THREE.MeshBasicMaterial({colorWrite:false});
  const block = (x0,x1,y0,y1)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,DEPTH),wallMat);
    m.position.set((x0+x1)/2,(y0+y1)/2,-DEPTH/2-.002); m.renderOrder=-1; root.add(m);
  };
  block(-.5,.5,BOT,STEP);
  block(UP_L,UP_R,STEP,TOP);

  const AH = .135, SC = AH/2.05;           // alien height in target units
  const alien = makeAlien();
  const mover = new THREE.Group(), pivot = new THREE.Group();
  pivot.position.y = AH*.5; alien.g.position.y = -AH*.5/SC; 
  const scaler = new THREE.Group(); scaler.scale.setScalar(SC); scaler.add(alien.g);
  pivot.add(scaler); mover.add(pivot); root.add(mover);

  const saucer = makeSaucer(); saucer.g.scale.setScalar(.085); root.add(saucer.g);
  const SAUCER = new THREE.Vector3(.1,-.07,.24);

  // Two hiding spots behind the roofline: tall block (A) and the lower roof on the right (B)
  const spots = [
    {x:-.09, roof:TOP,  z:-.075},
    {x:.36,  roof:STEP, z:-.075},
  ];
  const hidden = s => new THREE.Vector3(s.x, s.roof-AH-.03, s.z);
  const peek   = s => new THREE.Vector3(s.x, s.roof-AH*.42, s.z);

  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const clamp01 = v => Math.min(1,Math.max(0,v));
  const seg = (t,a,b) => clamp01((t-a)/(b-a));
  const HALF = 4.8;
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

  function update(time){
    // saucer hover
    const bobT = time*1.6;
    const sp = saucer.g.position.copy(SAUCER); sp.y += Math.sin(bobT)*.008;
    saucer.g.rotation.y = time*.9;
    saucer.lights.forEach((l,i)=> l.material.emissiveIntensity = .4 + 1.2*(.5+.5*Math.sin(time*6+i*.8)));

    const k = Math.floor(time/HALF), t = time - k*HALF;
    const from = spots[k%2], to = spots[(k+1)%2];
    let squash = 1, flip = 0, heading = 0, sway = 0, wave = 0, dip = 0;
    const pos = mover.position;

    if (t < 1.6){                         // rise and peek over the roof
      pos.lerpVectors(hidden(from), peek(from), ease(seg(t,0,.7)));
      heading = Math.sin(seg(t,.7,1.6)*Math.PI*2)*.6;
      sway = Math.sin(t*5)*.04;
    } else if (t < 1.85){                 // crouch
      pos.copy(peek(from)); squash = 1 - .25*Math.sin(seg(t,1.6,1.85)*Math.PI/2);
    } else if (t < 2.75){                 // leap over the wall onto the saucer
      const s = seg(t,1.85,2.75);
      tmpA.copy(peek(from)); tmpB.copy(sp); tmpB.y += saucer.deckTop*.085;
      pos.lerpVectors(tmpA,tmpB,s); pos.y += .22*4*s*(1-s);
      flip = ease(s)*Math.PI*2; squash = 1 + .18*Math.sin(s*Math.PI);
      heading = Math.atan2(tmpB.x-tmpA.x, tmpB.z-tmpA.z)*(1-s);
    } else if (t < 3.55){                 // land, wave hello
      const s = seg(t,2.75,3.55);
      const bounce = Math.exp(-s*6)*Math.cos(s*22);
      dip = bounce*.02; squash = 1 - .28*bounce;
      pos.copy(sp); pos.y += saucer.deckTop*.085 - dip;
      wave = Math.sin(s*Math.PI)*(.6+.4*Math.sin(s*30));
    } else if (t < 3.8){                  // crouch
      const s = seg(t,3.55,3.8);
      pos.copy(sp); pos.y += saucer.deckTop*.085; squash = 1 - .25*Math.sin(s*Math.PI/2);
      heading = Math.atan2(to.x-sp.x, to.z-sp.z)*s;
    } else {                              // leap back over the roof and vanish behind it
      const s = seg(t,3.8,HALF);
      tmpA.copy(sp); tmpA.y += saucer.deckTop*.085; tmpB.copy(hidden(to));
      pos.lerpVectors(tmpA,tmpB,s); pos.y += .4*4*s*(1-s);
      flip = -ease(s)*Math.PI*2; squash = 1 + .18*Math.sin(s*Math.PI);
      heading = Math.atan2(tmpB.x-tmpA.x, tmpB.z-tmpA.z);
      dip = -Math.exp(-s*8)*.012;
    }
    sp.y -= dip;
    mover.rotation.y = heading;
    pivot.rotation.set(flip,0,sway);
    scaler.scale.set(SC/Math.sqrt(squash), SC*squash, SC/Math.sqrt(squash));
    alien.arms[1].rotation.z = .7 + wave*1.9;
    alien.arms[0].rotation.z = -.7 - (squash>1 ? (squash-1)*6 : 0);
    const blink = (time%3.1) < .12 ? .15 : 1;
    alien.eyes.forEach(e=>e.scale.y = 1.15*blink);
    alien.head.rotation.z = Math.sin(time*2.2)*.05;
  }
  return update;
}

/* ---------- AR mode ---------- */
async function startAR(){
  msg.textContent = 'Starting camera…';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg.textContent = 'Camera is not available here. Open this page over https in Safari.'; return;
  }
  let mindarThree;
  try{
    const { MindARThree } = await import('mindar-image-three');
    mindarThree = new MindARThree({
      container: stage, imageTargetSrc: TARGET,
      uiLoading:'no', uiScanning:'no', uiError:'no',
      filterMinCF:.001, filterBeta:1000, warmupTolerance:3, missTolerance:5,
    });
    const {renderer, scene, camera} = mindarThree;
    const anchor = mindarThree.addAnchor(0);
    const update = buildWorld(anchor.group, {standIn:false});
    anchor.onTargetFound = ()=> document.body.classList.add('found');
    anchor.onTargetLost  = ()=> document.body.classList.remove('found');
    await mindarThree.start();
    $('start').style.display='none'; $('hint').style.display='block'; $('frame').style.display='block';
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(()=>{ update(clock.getElapsedTime()); renderer.render(scene,camera); });
    window.__ar = {anchor};
  }catch(e){
    console.error(e);
    msg.textContent = (e && e.name==='NotAllowedError')
      ? 'Camera permission was denied. Allow camera access for this site in Safari settings and reload.'
      : 'Could not start the camera. Open this page over https in Safari and allow camera access.';
  }
}

/* ---------- Preview mode (no camera): drag to look around ---------- */
function startPreview(){
  $('start').style.display='none';
  const hint=$('hint'); hint.textContent='Preview — drag to look around'; hint.style.display='block';
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc7cc);
  const camera = new THREE.PerspectiveCamera(45,1,.01,20);
  const root = new THREE.Group(); scene.add(root);
  const update = buildWorld(root,{standIn:true});
  let yaw=.5,pitch=.15,auto=true,last=null;
  const size=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};
  size(); addEventListener('resize',size);
  stage.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY];auto=false});
  addEventListener('pointermove',e=>{ if(!last)return; yaw-=(e.clientX-last[0])*.006; pitch+=(e.clientY-last[1])*.004;
    yaw=Math.max(-1.4,Math.min(1.4,yaw)); pitch=Math.max(-.3,Math.min(1.1,pitch)); last=[e.clientX,e.clientY]; });
  addEventListener('pointerup',()=>last=null);
  const clock = new THREE.Clock();
  window.__setTime = null;
  renderer.setAnimationLoop(()=>{
    const t = window.__setTime ?? clock.getElapsedTime();
    if(auto) yaw = Math.sin(t*.25)*.9;
    const d = camera.aspect<1 ? 2.0 : 1.3;
    camera.position.set(Math.sin(yaw)*Math.cos(pitch)*d, Math.sin(pitch)*d, Math.cos(yaw)*Math.cos(pitch)*d);
    camera.lookAt(0,0,0);
    update(t); renderer.render(scene,camera);
  });
}

$('go').addEventListener('click',startAR);
$('demo').addEventListener('click',startPreview);
</script>
